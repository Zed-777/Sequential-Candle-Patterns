[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "candle-patterns"
version = "1.4.0"
description = "Sequential pattern analysis system for candlestick/OHLCV data"
authors = [ { name = "Your Team" } ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.7.2",
    "plotly>=5.16",
    "dash>=2.9",
    "dash-bootstrap-components>=1.4",
    "joblib",
    "typer",
    "click",
    "pyyaml",
    "yfinance>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
# Exclude virtual environments, build artifacts and hidden folders
exclude = [".conda", ".venv", "env", "venv", "ENV", "build", "dist", ".git", "__pycache__", "node_modules", "notebooks", "**/*.ipynb"]
# Optional: adjust select/ignore rules if needed
# select = ["E","F","W","C" ]
# ignore = ["E203","W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# asyncio_mode = "auto"  # Not recognized in current pytest-asyncio version; using defaults
markers = [
	"asyncio: mark a test as asyncio-enabled",
	"e2e: mark an end-to-end Playwright test"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-playwright",
    "playwright",
    "ruff",
    "black",
    "mypy",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false  # Too strict for current codebase
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true  # Test fixtures and pytest decorators have known type issues

[tool.coverage.run]
branch = true
source = ["src/candle_patterns"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "**/__init__.py",
    "**/conftest.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):"
]
precision = 2
show_missing = true

[tool.bandit]
# Bandit security scanning configuration
# Documented exclusions below with rationale

# B104: Possible binding to all interfaces
# CONTEXT: dashboard.py line 145 binds Dash app to 0.0.0.0:8050 in TEST mode only
# RATIONALE: Production deployment uses localhost (127.0.0.1) by default.
#            Dash app is single-user, not exposed to network.
#            This is acceptable for development/testing context.

# B301: Pickle usage detected  
# CONTEXT: ml_baseline.py uses pickle for internal model serialization
# RATIONALE: Pickle used only for trusted internal sklearn model storage.
#            No untrusted data deserialized. Alternative (joblib) provides
#            no benefit and would add unnecessary dependency.
