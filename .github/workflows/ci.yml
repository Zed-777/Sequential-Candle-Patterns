name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies (pip)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r dev-requirements.txt

      - name: Lint (ruff)
        if: matrix.python-version == '3.12'
        run: ruff check .

      - name: Format check (black)
        if: matrix.python-version == '3.12'
        run: black --check .

      - name: Security scan (bandit)
        if: matrix.python-version == '3.12'
        run: |
          bandit -r src -f json -o bandit.json || true
          python << 'EOF'
          import json
          j = json.load(open('bandit.json'))
          found = False
          for r in j.get('results', []):
              if r.get('issue_severity') in ('MEDIUM', 'HIGH'):
                  print(f'Found {r.get("issue_severity")} bandit issue: {r.get("filename")} - {r.get("issue_text")}')
                  found = True
          if found:
              exit(1)
          print('Bandit: no medium/high findings')
          EOF

      - name: Run tests with coverage (enforce 80% min)
        run: pytest --cov=src --cov-report=xml --cov-report=term --cov-fail-under=80 -q --maxfail=5

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t candle-patterns:ci .
