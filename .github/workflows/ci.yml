name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies (pip)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install ruff black pytest pytest-cov pytest-asyncio mypy bandit

      - name: Lint (ruff)
        if: matrix.python-version == '3.12'
        run: ruff check .

      - name: Format check (black)
        if: matrix.python-version == '3.12'
        run: black --check .

      - name: Type check (mypy)
        if: matrix.python-version == '3.12'
        run: mypy src/candle_patterns --ignore-missing-imports --no-error-summary 2>&1 | head -50 || true

      - name: Security scan (bandit)
        if: matrix.python-version == '3.12'
        run: |
          bandit -r src -f json -o bandit.json || true
          python << 'EOF'
          import json
          j = json.load(open('bandit.json'))
          found = False
          for r in j.get('results', []):
              if r.get('issue_severity') in ('MEDIUM', 'HIGH'):
                  print(f'Found {r.get("issue_severity")} bandit issue: {r.get("filename")} - {r.get("issue_text")}')
                  found = True
          if found:
              exit(1)
          print('Bandit: no medium/high findings')
          EOF

      - name: Run tests with coverage (enforce 70% min)
        run: pytest tests/ -k "not e2e" --cov=src/candle_patterns --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=70 -v --tb=short --maxfail=5

      - name: Upload coverage reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

      - name: Comment coverage on PR
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 70

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t candle-patterns:ci .
