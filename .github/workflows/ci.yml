name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (pip)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r dev-requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Security scan (bandit)
        run: |
          bandit -r src -f json -o bandit.json || true
          python << 'EOF'
          import json
          j = json.load(open('bandit.json'))
          found = False
          for r in j.get('results', []):
              if r.get('issue_severity') in ('MEDIUM', 'HIGH'):
                  print(f'Found {r.get("issue_severity")} bandit issue: {r.get("filename")} - {r.get("issue_text")}')
                  found = True
          if found:
              exit(1)
          print('Bandit: no medium/high findings')
          EOF

      - name: Run tests with coverage (enforce 80% min)
        run: pytest --cov=src --cov-report=xml --cov-report=term --cov-fail-under=80 -q --maxfail=1

      - name: Build Docker image
        run: docker build -t candle-patterns:ci .

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
