name: E2E UI tests

on:
  push:
    branches: [ feature/mvp-setup ]
  pull_request:
    branches: [ feature/mvp-setup ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest-playwright pytest-asyncio pytest-timeout
          python -m playwright install --with-deps chromium
      
      - name: Run E2E tests
        run: pytest tests/e2e/ -m e2e -v --tb=short --maxfail=3 --timeout=120
        env:
          PYTHONPATH: src

